# Заметки «Малой формы», которых нет в макете.
#
# notes.yaml генерируется build-content.mjs из макета и перезаписывается
# целиком. Этот файл скрипты не трогают — сюда добавляются записи, пришедшие
# напрямую. Заметки без ссылки (url: "#") в вывод не попадают: в макете они
# были рыбой, а не содержанием.
#
# published — только для сортировки, на странице не показывается: там date,
# где типографика месяца своя в каждом языке.
#
# Пост английский, поэтому в date у остальных языков стоит пометка про язык
# оригинала — так же, как в articles-extra.yaml у русских статей.

