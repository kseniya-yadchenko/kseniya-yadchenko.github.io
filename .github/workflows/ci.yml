name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Полнота переводов
        run: npm run i18n:verify

      - name: Типы и ссылки
        run: npm run check

      - name: Линт
        run: npm run lint

      - name: Сборка
        run: npm run build

      # Не падает: до подстановки контента (T8.1) заглушки ожидаемы.
      # Перед публикацией то же самое запускается с --strict.
      - name: Плейсхолдеры
        run: node scripts/check-placeholders.mjs

      # PREVIEW_URL передаётся явно: скрипты не должны угадывать имя репозитория,
      # от которого зависит base. Переименование репозитория не должно ронять CI.
      - name: Переполнение и доступность
        env:
          PREVIEW_URL: http://localhost:4321/${{ github.event.repository.name }}
        run: |
          npx playwright install --with-deps chromium
          npx astro preview --port 4321 &
          npx wait-on "$PREVIEW_URL/" -t 60000
          node scripts/check-overflow.mjs
          node scripts/check-a11y.mjs
