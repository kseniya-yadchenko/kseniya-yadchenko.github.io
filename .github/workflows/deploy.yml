name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен последний, а не все подряд.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base и site вычисляются, а не прописываются руками. Это закрывает
      # классические грабли Astro на GitHub Pages: сайт в подкаталоге
      # <user>.github.io/<repo>/ требует base='/<repo>', а свой домен — '/'.
      # Наличие public/CNAME однозначно говорит, какой из двух случаев сейчас.
      - name: Определить base и site
        id: urls
        run: |
          if [ -f public/CNAME ]; then
            DOMAIN=$(tr -d '[:space:]' < public/CNAME)
            echo "site=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "Свой домен: $DOMAIN"
          else
            # Логин владельца приходит в исходном регистре (Stanislau-Senkevich),
            # а домен github.io всегда в нижнем. Без приведения регистра canonical
            # и sitemap уехали бы с заглавными буквами — браузер это простит,
            # поисковик посчитает другим URL.
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "Подкаталог: https://$OWNER.github.io/${{ github.event.repository.name }}/"
          fi

      - name: Сборка
        env:
          SITE_URL: ${{ steps.urls.outputs.site }}
          BASE_PATH: ${{ steps.urls.outputs.base }}
        run: npm run build

      # Без .nojekyll GitHub прогоняет вывод через Jekyll и вырезает папки,
      # начинающиеся с подчёркивания, — а Astro складывает ассеты в _astro/.
      # Симптом: сайт открывается без стилей.
      - name: Проверить .nojekyll
        run: test -f dist/.nojekyll || { echo "dist/.nojekyll отсутствует — стили не загрузятся"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
